<!DOCTYPE html>
<html lang="de">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Cross-a-chat</title>
 <style>
 /* Zwingt die Hauptseite, exakt so groß wie das Display zu sein */
 html, body {
 margin: 0;
 padding: 0;
 width: 100vw;
 height: 100vh;
 overflow: hidden;
 background-color: hsl(220, 80%, 12%);
 }

 /* Setzt den IFrame absolut über das gesamte Display */
 iframe {
 position: absolute;
 top: 0;
 left: 0;
 width: 100vw;
 height: 100vh;
 border: none;
 margin: 0;
 padding: 0;
 }
 </style>
</head>
<body>
 <iframe src="https://cross-a-chat.lovable.app" 
 title="Cross-a-chat"
 allow="camera; microphone; fullscreen">
 </iframe>
</body>
</html>
